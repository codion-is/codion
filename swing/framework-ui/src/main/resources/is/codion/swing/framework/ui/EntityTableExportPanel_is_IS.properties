help_text=Haki\u00f0 vi\u00f0 d\u00e1lkana sem \u00e1 a\u00f0 flytja \u00fat \u00ed tr\u00e9nu til vinstri, me\u00f0 \u00fev\u00ed a\u00f0 smella \u00e1 haki\u00f0, tv\u00edsmella \u00e1 d\u00e1lk\ne\u00f0a draga d\u00e1lk yfir \u00ed t\u00f6fluna h\u00e6gra megin, sem s\u00fdnir d\u00e1lkana \u00ed \u00fatflutningsr\u00f6\u00f0.\nFyrirs\u00f6gn d\u00e1lks er breytt me\u00f0 F2 e\u00f0a tv\u00edsmelli, t\u00f3m fyrirs\u00f6gn ver\u00f0ur sj\u00e1lfgefin.\nH\u00e6grismelli\u00f0 \u00e1 tr\u00e9\u00f0 e\u00f0a t\u00f6fluna fyrir fleiri a\u00f0ger\u00f0ir, til d\u00e6mis til a\u00f0 birta falda d\u00e1lka.\n\nVista\u00f0ar stillingar eru \u00ed flettilistanum fyrir ne\u00f0an.
